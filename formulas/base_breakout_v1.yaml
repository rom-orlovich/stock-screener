version: base_breakout_v1
direction: long
indicators:
  rsi_period: 14
  sma_fast: 50
  sma_slow: 200
  momentum_lookback: 60
  breakout_lookback: 30
  atr_period: 14
  atr_contraction_lookback: 30
  atr_contraction_threshold: 0.385
  vol_short_lookback: 20
  vol_long_lookback: 60
  vol_dryup_threshold: 0.75
  bb_period: 20
  bb_squeeze_lookback: 60
  bb_squeeze_percentile: 0.2
  trend_gate_quietness: true
timeframe_score_weights:
  momentum: 0.05
  trend: 0.2
  rsi: 0.0
  breakout: 0.2
  breakout_thrust: 0.25
  volatility: 0.0
  atr_contraction: 0.15
  volume_dryup: 0.15
  bb_squeeze: 0.00

rsi_band: [45, 75]

# Event-entry + trade management. Read by bt.config_from_formula (run.py,
# run_regimes.py). mode="event" filters each weekly W-FRI scan to names with a
# volume-confirmed break (close > prior-N high AND volume >= k*avg) on any of the
# trailing event_window_bars; the tight ATR stop + trailing + time stop create
# the asymmetric R:R a real breakout system needs. Run with --mode rebalance to
# A/B against the legacy no-event path.
backtest:
  mode: event
  vol_confirm_mult: 1.5          # k: today's volume >= 1.5 * avg_vol_long
  event_lookback: 30             # prior-N-bar high (matches breakout_lookback)
  event_vol_lookback: 60         # avg-volume window for confirmation
  event_window_bars: 5           # break fired on any of trailing 5 bars <= d0
  atr_stop_mult: 2.0             # hard stop = entry - 2*ATR(14)
  atr_stop_period: 14
  trailing_stop_pct: 0.06        # let winners run, trail 6% off the peak
  trailing_activate_pct: 0.05
  time_stop_bars: 15

# Daily dominates — base breakout is a short-horizon setup.
timeframe_weights:
  daily: 0.75
  weekly: 0.2
  monthly: 0.05
alignment_bonus: 0.1
bounds:
  rsi_period:
  - 7
  - 28
  sma_fast:
  - 20
  - 80
  sma_slow:
  - 150
  - 300
  momentum_lookback:
  - 20
  - 120
  breakout_lookback:
  - 20
  - 60
  breakout_thrust:
  - 0.1
  - 0.4
  atr_period:
  - 7
  - 28
  atr_contraction_lookback:
  - 15
  - 60
  atr_contraction_threshold:
  - 0.15
  - 0.5
  vol_short_lookback:
  - 10
  - 40
  vol_long_lookback:
  - 30
  - 120
  vol_dryup_threshold:
  - 0.5
  - 0.9
  bb_period:
  - 10
  - 30
  bb_squeeze_lookback:
  - 30
  - 120
  bb_squeeze_percentile:
  - 0.05
  - 0.35
  alignment_bonus:
  - 0.0
  - 0.2
  rsi_band_low:
  - 35
  - 55
  rsi_band_high:
  - 65
  - 85
