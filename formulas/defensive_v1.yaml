# Defensive v1 — capital preservation for weak / choppy markets.
# Built explicitly for periods where every long-only momentum strategy
# bleeds (e.g. 2022). The thesis: prefer low-volatility names that are
# still in a mild uptrend, and rotate the entire book to SHY (bonds)
# when SPY itself loses absolute momentum.
#
# Not designed to beat momentum_v1 in a roaring bull. Designed to lose
# less when the tape turns hostile, then compound from a higher base.
version: defensive_v1
direction: long

indicators:
  rsi_period: 14
  sma_fast: 50
  sma_slow: 200
  momentum_lookback: 126           # 6M — slow, ignore short-term noise
  momentum_skip_recent: 21         # skip last month to dampen reversion
  breakout_lookback: 252
  volatility_lookback: 90          # 90d realised vol — defines "low vol"

  # Inherited knobs (engine compat — kept zero-weighted).
  atr_period: 14
  atr_contraction_lookback: 20
  atr_contraction_threshold: 0.30
  vol_short_lookback: 20
  vol_long_lookback: 60
  vol_dryup_threshold: 0.80
  bb_period: 20
  bb_squeeze_lookback: 60
  bb_squeeze_percentile: 0.20

# Volatility-dominated. Trend confirms the name is not in a downtrend.
# Tiny momentum tilt keeps obviously dead names out. RSI band as filter.
timeframe_score_weights:
  momentum: 0.10
  trend: 0.25
  rsi: 0.05
  breakout: 0.00
  volatility: 0.60                 # dominant: low vol -> high score
  atr_contraction: 0.00
  volume_dryup: 0.00
  bb_squeeze: 0.00

# Tight band: avoid both the falling-knife side and the euphoric side.
# Defensive book wants stable names with a healthy-but-not-stretched RSI.
rsi_band: [45, 65]

# Monthly heavy — defensive selection should not chase weekly wiggles.
timeframe_weights:
  daily: 0.10
  weekly: 0.25
  monthly: 0.65

alignment_bonus: 0.05

# Absolute-momentum guard — the core defense. When SPY 12M-skip-1 return
# falls below the bond proxy, the engine rotates everything to SHY
# instead of holding the top-N. This is what makes the strategy
# bear-aware: 2022, 2008-style tape -> sits in bonds, not equities.
absolute_momentum:
  benchmark: SPY
  bond_proxy: SHY
  lookback: 252
  skip_recent: 21
  cash_fallback: SHY

bounds:
  rsi_period: [7, 28]
  sma_fast: [20, 80]
  sma_slow: [150, 300]
  momentum_lookback: [60, 252]
  momentum_skip_recent: [0, 42]
  breakout_lookback: [120, 320]
  volatility_lookback: [30, 180]
  atr_period: [7, 28]
  atr_contraction_lookback: [10, 60]
  atr_contraction_threshold: [0.10, 0.50]
  vol_short_lookback: [10, 40]
  vol_long_lookback: [30, 120]
  vol_dryup_threshold: [0.50, 0.95]
  bb_period: [10, 30]
  bb_squeeze_lookback: [30, 120]
  bb_squeeze_percentile: [0.05, 0.40]
  alignment_bonus: [0.0, 0.15]
  rsi_band_low: [40, 55]
  rsi_band_high: [60, 75]
