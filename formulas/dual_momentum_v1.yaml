# Dual momentum (Antonacci-style) — cross-sectional + absolute momentum.
# Holds the top-N strongest momentum names from the universe, but only when
# the market itself is in a momentum regime (SPY 12M return > T-bill proxy).
# In risk-off regimes the engine should rotate to SHY (bonds). The bond
# rotation is enforced at the backtest layer; this YAML defines the ranker.
version: dual_momentum_v1
direction: long

indicators:
  # Classic 12-1 momentum: 252 trading days, skip the last 21 to avoid
  # short-term mean reversion contaminating the signal.
  rsi_period: 14
  sma_fast: 50
  sma_slow: 200
  momentum_lookback: 252
  momentum_skip_recent: 21      # NEW knob — engine/score must honor it
  breakout_lookback: 252        # 52-week high proximity

  # Pre-breakout knobs unused here (kept for shared score.py compatibility).
  atr_period: 14
  atr_contraction_lookback: 20
  atr_contraction_threshold: 0.30
  vol_short_lookback: 20
  vol_long_lookback: 60
  vol_dryup_threshold: 0.80
  bb_period: 20
  bb_squeeze_lookback: 60
  bb_squeeze_percentile: 0.20

# Heavy momentum + trend confirmation. RSI band acts as a soft filter
# (avoid wildly overbought names that already extended).
timeframe_score_weights:
  momentum: 0.60
  trend: 0.25
  rsi: 0.05
  breakout: 0.10
  volatility: 0.00
  atr_contraction: 0.00
  volume_dryup: 0.00
  bb_squeeze: 0.00

rsi_band: [40, 75]

# Monthly dominates — dual momentum is a slow signal, not a swing trade.
timeframe_weights:
  daily: 0.10
  weekly: 0.30
  monthly: 0.60

alignment_bonus: 0.10

# Absolute-momentum guard (engine/backtest.py will read this when present):
# rotate to `cash_fallback` if SPY 12M-skip-1 return <= bond_yield_proxy.
absolute_momentum:
  benchmark: SPY
  bond_proxy: SHY
  lookback: 252
  skip_recent: 21
  cash_fallback: SHY

bounds:
  rsi_period: [7, 28]
  sma_fast: [20, 80]
  sma_slow: [150, 300]
  momentum_lookback: [180, 320]
  momentum_skip_recent: [0, 42]
  breakout_lookback: [120, 320]
  atr_period: [7, 28]
  atr_contraction_lookback: [10, 60]
  atr_contraction_threshold: [0.10, 0.50]
  vol_short_lookback: [10, 40]
  vol_long_lookback: [30, 120]
  vol_dryup_threshold: [0.50, 0.95]
  bb_period: [10, 30]
  bb_squeeze_lookback: [30, 120]
  bb_squeeze_percentile: [0.05, 0.40]
  alignment_bonus: [0.0, 0.20]
  rsi_band_low: [30, 50]
  rsi_band_high: [60, 85]
