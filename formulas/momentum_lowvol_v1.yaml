# Momentum + Low-Vol — combines price momentum with a volatility penalty so the
# top ranks favour names that trend up smoothly (high return / low noise).
# Roughly a cross-sectional Sharpe ranker.
version: momentum_lowvol_v1
direction: long

indicators:
  rsi_period: 14
  sma_fast: 20
  sma_slow: 50
  momentum_lookback: 126           # ~6M trend (medium horizon)
  breakout_lookback: 55
  volatility_lookback: 63          # ~3M rolling stdev for the vol score

# Heavy momentum, but volatility carries weight too: high-vol names get
# pushed down in the ranking.
timeframe_score_weights:
  momentum: 0.45
  trend: 0.20
  rsi: 0.05
  breakout: 0.00
  volatility: 0.30
  atr_contraction: 0.00
  volume_dryup: 0.00
  bb_squeeze: 0.00

rsi_band: [50, 70]

timeframe_weights:
  daily: 0.20
  weekly: 0.40
  monthly: 0.40

alignment_bonus: 0.10

bounds:
  rsi_period: [7, 28]
  sma_fast: [10, 30]
  sma_slow: [40, 100]
  momentum_lookback: [60, 250]
  breakout_lookback: [20, 100]
  volatility_lookback: [30, 180]
  alignment_bonus: [0.0, 0.20]
  rsi_band_low: [40, 55]
  rsi_band_high: [60, 80]
